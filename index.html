<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APPEARICH - Scent Hub</title>
  <style>
    /* Global Reset & Styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #000000;
      color: #ffffff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* WebOS Dashboard Container */
    .tv-dashboard {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      position: relative;
    }

    /* Header Section */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .brand-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #cccccc;
    }

    .brand-logo {
      font-size: 2.8rem;
      font-weight: 900;
      line-height: 1;
      margin-top: 5px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      letter-spacing: 1px;
    }

    /* Logo Color Split */
    .logo-appea {
      color: #ffffff;
    }

    .logo-rich {
      color: #FFC107;
    }

    .badges {
      display: flex;
      gap: 12px;
    }

    .badge {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1.5px solid #FFC107;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 0.6rem;
      font-weight: bold;
      color: #ffffff;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }

    /* Main Section Container */
    .content-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      width: 100%;
    }

    /* Middle Perfume Carousel */
    .cards-section {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding: 15px 5px;
      width: 100%;
      scrollbar-width: none;
    }

    .cards-section::-webkit-scrollbar {
      display: none;
    }

    .card {
      min-width: 240px;
      height: 320px;
      border-radius: 18px;
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 15px 35px rgba(255, 193, 7, 0.25);
      border-color: #FFC107;
    }

    .card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(to top, #000000 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
    }

    .card-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .card-subtitle {
      font-size: 0.85rem;
      color: #FFC107;
    }

    /* Center PLACE YOUR ORDER Button */
    .action-container {
      display: flex;
      justify-content: center;
      width: 100%;
      padding-bottom: 10px;
    }

    .order-main-btn {
      background: #FFC107;
      border: 2px solid #ffffff;
      color: #000000;
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      padding: 18px 45px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 193, 7, 0.3);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      text-transform: uppercase;
    }

    .order-main-btn:hover {
      transform: translateY(-4px) scale(1.04);
      background: #ffffff;
      color: #000000;
      border-color: #FFC107;
      box-shadow: 0 15px 35px rgba(255, 255, 255, 0.4);
    }

    /* Interactive Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(10px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #111111;
      width: 90%;
      max-width: 440px;
      border-radius: 24px;
      padding: 25px;
      text-align: left;
      position: relative;
      border: 1px solid #FFC107;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      max-height: 90vh;
      overflow-y: auto;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 1.6rem;
      cursor: pointer;
      color: #aaa;
    }

    .close-btn:hover { color: #FFC107; }

    .modal-title { font-size: 1.6rem; margin-bottom: 6px; font-weight: 800; text-align: center; color: #ffffff; }
    .modal-subtitle-text { font-size: 0.85rem; color: #FFC107; text-align: center; margin-bottom: 18px; }

    .price-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .price-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 12px 5px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .price-card:hover, .price-card.active {
      border-color: #FFC107;
      background: rgba(255, 193, 7, 0.15);
    }

    .size-title { font-size: 0.85rem; color: #ffffff; font-weight: bold; }
    .size-price { font-size: 0.8rem; font-weight: bold; color: #FFC107; margin-top: 4px; }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #ffffff;
      font-weight: 600;
    }

    .form-group textarea {
      width: 100%;
      height: 85px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 10px;
      color: white;
      font-size: 0.9rem;
      resize: none;
      outline: none;
    }

    .form-group textarea:focus {
      border-color: #FFC107;
    }

    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      background: #25D366;
      color: white;
      font-weight: bold;
      border-radius: 12px;
      text-decoration: none;
      font-size: 1rem;
      transition: background 0.2s ease;
      border: none;
      cursor: pointer;
    }

    .whatsapp-btn:hover { background: #1eb855; }
  </style>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="tv-dashboard">
    
    <!-- Top Branding & Badges -->
    <header class="header">
      <div>
        <div class="brand-title">powered by</div>
        <div class="brand-logo">
          <span class="logo-appea">APPEA</span><span class="logo-rich">RICH</span>
        </div>
      </div>
      <div class="badges">
        <div class="badge">
          <span>100%</span>
          <span>ORIGINAL</span>
        </div>
        <div class="badge">
          <span>FAST</span>
          <span>DELIVERY</span>
        </div>
      </div>
    </header>

    <!-- Content Container (Perfume Cards + Place Order Button) -->
    <div class="content-container">
      
      <!-- Middle Perfume Carousel -->
      <main class="cards-section">
        
        <!-- Perfume 1 -->
        <div class="card" style="background-image: url('perfume1.jpg');" onclick="openProductModal('Vanilla')">
          <div class="card-overlay">
            <div class="card-title">Vanilla</div>
            <div class="card-subtitle">Woody • Vanilla • Amber</div>
          </div>
        </div>

        <!-- Perfume 2 -->
        <div class="card" style="background-image: url('perfume2.jpg');" onclick="openProductModal('Sugar Candy')">
          <div class="card-overlay">
            <div class="card-title">Sugar Candy</div>
            <div class="card-subtitle">Floral • Sweet</div>
          </div>
        </div>

        <!-- Perfume 3 -->
        <div class="card" style="background-image: url('perfume3.jpg');" onclick="openProductModal('212 VIP')">
          <div class="card-overlay">
            <div class="card-title">212 VIP</div>
            <div class="card-subtitle">Fresh • Sea Salt</div>
          </div>
        </div>

        <!-- Perfume 4 -->
        <div class="card" style="background-image: url('perfume4.jpg');" onclick="openProductModal('Tag Sunset')">
          <div class="card-overlay">
            <div class="card-title">Tag Sunset</div>
            <div class="card-subtitle">Rich Spices</div>
          </div>
        </div>

      </main>

      <!-- Center Single PLACE YOUR ORDER Button -->
      <footer class="action-container">
        <button onclick="openOrderModal()" class="order-main-btn">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span>PLACE YOUR ORDER</span>
        </button>
      </footer>

    </div>

  </div>

  <!-- Place Your Order Modal -->
  <div class="modal" id="orderModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div class="modal-title">Place Your Order</div>
      <div class="modal-subtitle-text">Select your bottle size & perfume details</div>
      
      <!-- Size Selection -->
      <label style="font-size:0.85rem; color:#ffffff; font-weight:600; display:block; margin-bottom:8px;">1. Select Size:</label>
      <div class="price-grid">
        <div class="price-card active" onclick="selectSize(this, '30ml (25,000/= TZS)')">
          <div class="size-title">30ml</div>
          <div class="size-price">25,000/=</div>
        </div>
        <div class="price-card" onclick="selectSize(this, '50ml (35,000/= TZS)')">
          <div class="size-title">50ml</div>
          <div class="size-price">35,000/=</div>
        </div>
        <div class="price-card" onclick="selectSize(this, '100ml (55,000/= TZS)')">
          <div class="size-title">100ml</div>
          <div class="size-price">55,000/=</div>
        </div>
      </div>

      <!-- Description Input -->
      <div class="form-group">
        <label for="scentDesc">2. Perfume Name or Description:</label>
        <textarea id="scentDesc" placeholder="Enter perfume name (e.g., Vanilla, 212 VIP) or describe what scent you want..."></textarea>
      </div>

      <button onclick="sendWhatsAppOrder()" class="whatsapp-btn">
        <i class="fa-brands fa-whatsapp"></i> Send Order on WhatsApp
      </button>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    const whatsappPhone = "255764519027";
    let selectedSize = "30ml (25,000/= TZS)";

    function openProductModal(name) {
      document.getElementById('scentDesc').value = `Perfume: ${name}`;
      document.getElementById('orderModal').style.display = 'flex';
    }

    function openOrderModal() {
      document.getElementById('orderModal').style.display = 'flex';
    }

    function selectSize(element, sizePrice) {
      document.querySelectorAll('#orderModal .price-card').forEach(c => c.classList.remove('active'));
      element.classList.add('active');
      selectedSize = sizePrice;
    }

    function sendWhatsAppOrder() {
      const userDescription = document.getElementById('scentDesc').value.trim();
      
      if (!userDescription) {
        alert("Please enter a perfume name or describe the scent you want!");
        return;
      }

      const msg = encodeURIComponent(`Hi APPEARICH! I would like to place an order:\n\n- Preferred Size: ${selectedSize}\n- Perfume Details: "${userDescription}"`);
      window.open(`https://wa.me/${whatsappPhone}?text=${msg}`, '_blank');
    }

    function closeModal() {
      document.getElementById('orderModal').style.display = 'none';
    }
  </script>

</body>
</html>
